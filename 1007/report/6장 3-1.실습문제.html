<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document.write()</title>
</head>
<body>
    <script>
        document.writeln('*');
        document.write("<br>");
        document.writeln('**');
        document.write("<br>");
        document.writeln('***');
        document.write("<br>");
        document.writeln('****');
        document.write("<br>");
        document.writeln('*****');
    </script>
</body>
</html>
