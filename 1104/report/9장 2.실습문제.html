<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라디오 버튼과 이미지 출력</title>
    <script>
        function drawImg(){
            let found = null;
            let fruits = document.getElementsByName("fruits");
            let img = document.getElementById("fruitsImg");

            for(let i=0; i<fruits.length; i++){
                if(fruits[i].checked==true){
                    found = fruits[i];
                    break;
                }
            }
            img.src = found.value;
        }
    </script>
</head>
<body>
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다</h3>
    <hr>
    <form>
        <input type="radio" name="fruits" value="./banana.png" onchange="drawImg()">바나나
        <input type="radio" name="fruits" value="./mango.png" onchange="drawImg()">망고
        <input type="radio" name="fruits" value="./apple.png" onchange="drawImg()">사과

    </form>
    
    <img id="fruitsImg" src="" >
</body>
</html>
