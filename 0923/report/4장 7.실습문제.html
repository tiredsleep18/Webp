<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:hover 활용</title>
    <style>
        .container {
            width: 200px;
            height: 300px;
        }

        .card{
            background-image: url("card_back.png");
            background-size: cover;
            width: 100%;
            height: 100%;
        }

        .container:hover .card{
            background-image: url(./card_front.png);
        }
    </style>
</head>
<body>
    <h3>:hover 활용</h3>
    <hr>
    <p>마우스를 올리면 카드의 앞면이 보인다.</p>
    <div class="container"><div class="card"></div></div>
    
</body>
</html>
