<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-shadow와 box-shadow</title>
    <style>
        h2{
            color: yellow;
            text-align: center;
            text-shadow: 3px 3px 2px blue;
        }

        #boggle, #ziggle, #dagoole{
            border: 2px solid grey;
        }
        #boggle:hover, #ziggle:hover, #dagoole:hover{
            box-shadow: 5px 5px 20px;
        }

        img{
            width: 20%;
            height: 20%;
        }


    </style>
</head>
<body>
    <h2>Most Visited Pages</h2>
    <hr>
    <div class="container"><img id="boggle" src="./boggle.png" alt="boggle"><img id="ziggle" src="ziggle.png" alt="ziggle"><img id="dagoole" src="dagoole.png" alt="dagoole"></div>
</body>
</html>
