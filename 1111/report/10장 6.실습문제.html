<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout()/clear</title>
    <style>
        div{
            display: inline-block;
            width: 7em;
            border: 1px solid gray;
            background-color: aliceblue;

        }
    </style>

    <script>
        let time = null;
        function onoffTime(){
            if(time!==null){
                clearInterval(time);
                time=null;
                document.getElementById("clock").style.color="gray"
            }else{
                time = setInterval(outtime,100);
                document.getElementById("clock").style.color = "black"
            }
        }

        function gotime(){
            outtime(clock);
            time = setInterval(outtime,100);
        }

        function outtime(){
            let clock = document.getElementById("clock");

            let date= new Date();
            clock.innerHTML = date.toLocaleString()
        }
    </script>
</head>
<body onload="gotime()">
    <h3>div 태그에 시계 만들기</h3>
    <p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
    <hr>
    <div id="clock" onclick="onoffTime()"></div>
</body>
</html>
